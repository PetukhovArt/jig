name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate plugin
        shell: bash
        run: |
          if ! command -v claude >/dev/null 2>&1; then
            echo "::warning::claude CLI is not available on this runner, skipping plugin validation"
            exit 0
          fi
          claude plugin validate . --strict
