name: Weekly release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  merge-version-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Merge the version pull request when main is green
        run: |
          pr=$(gh pr list --head changeset-release/main --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "no version pull request: nothing to release"
            exit 0
          fi
          main=$(gh api "repos/$GH_REPO/commits/main" -q .sha)
          ci=$(gh run list --workflow ci.yml --branch main --commit "$main" --limit 1 --json conclusion -q '.[0].conclusion')
          if [ "$ci" != "success" ]; then
            echo "::error::CI on main $main is '${ci:-not run}': no release this week"
            exit 1
          fi
          gh pr merge "$pr" --squash
          # A merge made with GITHUB_TOKEN starts no push workflow, only workflow_dispatch:
          # https://docs.github.com/en/actions/concepts/security/github_token#when-github_token-triggers-workflow-runs
          gh workflow run release.yml --ref main
