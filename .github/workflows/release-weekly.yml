name: Weekly release

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  merge-version-pr:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - name: Land the version pull request when main is green
        run: |
          pr=$(gh pr list --head changeset-release/main --state open --json number -q '.[0].number')
          if [ -z "$pr" ]; then
            echo "no version pull request: nothing to release"
            exit 0
          fi
          main=$(git rev-parse HEAD)
          ci=$(gh run list --workflow ci.yml --branch main --commit "$main" --limit 1 --json conclusion -q '.[0].conclusion')
          if [ "$ci" != "success" ]; then
            echo "::error::CI on main $main is '${ci:-not run}': no release this week"
            exit 1
          fi
          # main takes changes only through a pull request its owner approved, and GITHUB_TOKEN cannot
          # get past that rule; the RELEASE_DEPLOY_KEY deploy key can, and its push also starts
          # `Release`, which a push made with GITHUB_TOKEN does not. The changesets action rebuilds the
          # branch as one commit on top of main after every push, so a fast-forward lands it and marks
          # the pull request merged; a branch not on top of main yet is refused until the next run.
          git fetch origin changeset-release/main
          git push origin FETCH_HEAD:main
