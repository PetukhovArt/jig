name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
          publish: npx changeset tag
          commit: 'chore: version jig'
          title: 'chore: version jig'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Note the release on its fixed issues
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          retry() { for wait in 5 15 45; do "$@" && return 0; sleep "$wait"; done; "$@"; }
          retry gh issue list --state closed --label fixed-on-main --limit 200 --json number -q '.[].number' > fixed.txt
          while read -r n; do
            retry gh issue edit "$n" --remove-label fixed-on-main
            retry gh issue comment "$n" --body "Released in jig $version: https://github.com/${{ github.repository }}/releases"
          done < fixed.txt
