<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>jig run</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
h1,h2,p,ol,ul{margin:0}
ol,ul{padding:0;list-style:none}
a:focus-visible,button:focus-visible,.sign:focus-visible,textarea:focus-visible{outline:3px solid var(--now);outline-offset:2px;border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
body{--bg:#141B26;--ink:#E6EAF0;--muted:#8A96A8;--go:#2FB38A;--now:#4C8DFF;--stop:#F0564A;--wait:#465264;--sign:#FFC72C;--sign-ink:#14213D;--rule:#2A3444;--panel:#1B2431;
  margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,'Segoe UI',sans-serif;overflow-wrap:anywhere;-webkit-text-size-adjust:100%}
body.light{--bg:#EEF1F4;--ink:#14213D;--muted:#5B6678;--go:#1F8A70;--now:#2F6FEB;--stop:#E03E2F;--wait:#B8C2CC;--rule:#14213D;--panel:#FFFFFF}
a{color:var(--now)}
button{font:inherit;cursor:pointer;min-height:44px;border-radius:6px}
.wrap{max-width:1600px;margin:0 auto;padding:clamp(14px,3vw,32px)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px 20px;flex-wrap:wrap;padding-bottom:14px;border-bottom:2px solid var(--rule)}
.head>div{min-width:0}
.head h1{font-size:clamp(19px,1.2rem + .6vw,24px);line-height:1.2;font-weight:700;letter-spacing:-.01em}
.sub{margin-top:3px;color:var(--muted);font-size:14px}
.pos{font-size:17px;font-weight:500;color:var(--muted);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pos b{color:var(--ink);font-weight:700}
.theme{min-width:44px;background:none;border:1px solid var(--rule);color:var(--muted);padding:0 10px;font-size:16px}
.copy{border:0;padding:0 16px;background:var(--sign);color:var(--sign-ink);font-size:15px;font-weight:700}
.copy:disabled{opacity:.45;cursor:default}
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;margin-top:18px}
.sign{min-width:0;background:var(--sign);color:var(--sign-ink);padding:14px 16px;border-radius:6px;cursor:pointer}
.sign h2{font-size:14px;font-weight:700}
.sign p{margin-top:6px;font-size:15px;line-height:1.4;font-weight:500}
.sign .def{margin-top:10px;padding-top:8px;border-top:2px solid var(--sign-ink);font-size:14px}
.sign .when{margin-top:4px;font-size:12px}
.sign .hint{margin-top:8px;font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.sign .draft{margin-top:10px;padding:8px 10px;border-radius:4px;background:color-mix(in srgb,var(--sign-ink) 10%,transparent);font-size:14px}
.sign .draft .tag{display:inline-block;margin-right:6px;padding:0 6px;border-radius:4px;background:var(--sign-ink);color:var(--sign);font-size:12px;font-weight:700}
.reply{display:block;width:100%;min-height:110px;margin-top:10px;padding:10px 12px;border:2px solid var(--sign-ink);border-radius:6px;background:#FFFDF4;color:#14213D;font-family:inherit;font-size:16px;line-height:1.4;resize:vertical}
.decided{margin-top:22px}
.decided h2,aside h2{font-size:14px;font-weight:700}
.cards{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.card{min-width:0;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--muted) 30%,transparent);border-left:4px solid var(--go);border-radius:6px;background:var(--panel)}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .txt{font-size:clamp(16px,.9rem + .3vw,18px);line-height:1.35;font-weight:600}
.card dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 8px;font-size:14px;color:var(--muted)}
.card dt{color:var(--ink);font-weight:500}
.card dd{margin:0;min-width:0}
.card.reverted{opacity:.55;border-left-color:var(--stop)}
.card.reverted .txt{text-decoration:line-through;text-decoration-color:var(--stop)}
.card .tag{padding:0 6px;border-radius:4px;background:var(--stop);color:#fff;font-size:12px;font-weight:600}
.body{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,28vw,440px);gap:clamp(20px,3vw,40px);margin-top:24px;align-items:start}
.line{width:fit-content;max-width:100%;margin:0 auto}
.line li{display:grid;grid-template-columns:52px 28px minmax(0,1fr);min-height:36px}
.line time{font-size:13px;color:var(--muted);padding-top:1px;font-variant-numeric:tabular-nums}
.st{position:relative}
.st::before{content:"";position:absolute;left:11px;top:6px;bottom:-6px;width:6px;background:var(--c)}
.line li:last-child .st::before{display:none}
.st i{position:absolute;left:5px;top:1px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:5px solid var(--c);z-index:1}
.s-done{--c:var(--go)}
.s-done .nm{color:var(--muted)}
.s-todo{--c:var(--wait)}
.s-todo .st::before{background:repeating-linear-gradient(var(--wait) 0 8px,transparent 8px 14px)}
.s-blocked{--c:var(--stop)}
.s-blocked .st i{background:var(--stop)}
.s-blocked .st i::after{content:"";position:absolute;left:1px;right:1px;top:50%;height:3px;margin-top:-1.5px;background:#fff}
.s-active{--c:var(--now)}
.s-active .st i{left:1px;top:-3px;width:26px;height:26px;border-width:7px;animation:pulse 1.6s ease-out 1}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--now) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
.nm{min-width:0;padding:0 0 9px 8px}
.nm b{font-weight:600}
.nm small{display:block;font-size:13px;color:var(--muted)}
.s-blocked small,.stale small{color:var(--stop);font-weight:500}
.here{display:inline-block;margin-left:6px;padding:0 7px;border-radius:4px;background:var(--now);color:#fff;font-size:12px;font-weight:600;vertical-align:1px}
aside{min-width:0;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;padding-right:6px;scrollbar-color:var(--wait) transparent}
aside section+section{margin-top:20px}
.closed li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;margin-top:7px}
.closed li::before{content:"";width:16px;height:16px;margin-top:2px;border-radius:50%;background:var(--stop) linear-gradient(#fff,#fff) center/10px 3px no-repeat}
.closed small{display:block;color:var(--muted);font-size:13px}
.list li{display:grid;grid-template-columns:48px minmax(0,1fr);gap:6px;padding:8px 0;font-size:14px;line-height:1.4;border-bottom:1px solid color-mix(in srgb,var(--muted) 22%,transparent)}
.list time{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.list small{display:block;color:var(--muted);font-size:13px}
@media (max-width:900px){
  .body{grid-template-columns:minmax(0,1fr)}
  aside{position:static;max-height:none;overflow:visible;padding-right:0}
  .line{width:auto;margin:0}
}
@media (max-width:480px){
  .wrap{padding-bottom:92px}
  .head{align-items:flex-start}
  .line li{grid-template-columns:28px minmax(0,1fr);grid-template-areas:"st nm" "st tm"}
  .line .st{grid-area:st}
  .line .nm{grid-area:nm;padding-bottom:0}
  .line time{grid-area:tm;padding:0 0 10px 8px;font-size:12px}
  .copy{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:5;min-height:52px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
}
</style>
</head>
<body>
<div id="app"></div>
<script type="application/json" id="run">
{"v":1,"title":"","branch":"","createdAt":"","updatedAt":"","steps":[],"decisions":[],"results":[],"asks":[]}
</script>
<script>
const R = JSON.parse(document.getElementById('run').textContent);
const STALE_MS = 15 * 60e3;
const REFRESH_MS = 30e3;
const COPIED_MS = 2500;
const LABELS = {
  en: {
    locale: 'en-GB',
    run: 'jig run',
    branch: 'Branch',
    updated: 'updated at',
    step: (n, total) => `Step <b>${n}</b> of ${total}`,
    done: (n, total) => `Done <b>${n}</b> of ${total}`,
    theme: 'Light or dark theme',
    steps: 'Steps',
    here: 'now here',
    since: 'since',
    waitsFor: 'waits for',
    stale: (at, ago) => `no news since ${at}, ${ago}`,
    ask: n => `Your decision needed (#${n})`,
    fallback: 'Going with the default meanwhile:',
    asked: 'Asked at',
    answerHint: 'Tap to write an answer',
    answerLabel: n => `Answer to question #${n}`,
    draft: 'answer draft',
    copy: 'Copy answers',
    copied: n => `copied (${n})`,
    copyFailed: 'copy failed',
    answersFor: title => `Answers for run "${title}":`,
    answerItem: (n, question) => `#${n} ${question}`,
    decisions: 'Decisions',
    why: 'why',
    evidence: 'evidence',
    reverted: 'reverted',
    stuck: 'Stuck',
    results: 'Results',
    answered: 'Answered',
    justNow: 'just now',
    minAgo: m => `${m} min ago`,
    hoursAgo: (h, m) => `${h} h ${m} min ago`,
    daysAgo: d => `${d} d ago`,
  },
  ru: {
    locale: 'ru-RU',
    run: 'Прогон jig',
    branch: 'Ветка',
    updated: 'обновлено в',
    step: (n, total) => `Шаг <b>${n}</b> из ${total}`,
    done: (n, total) => `Готово <b>${n}</b> из ${total}`,
    theme: 'Светлая или тёмная тема',
    steps: 'Шаги',
    here: 'сейчас здесь',
    since: 'идёт с',
    waitsFor: 'ждёт',
    stale: (at, ago) => `нет вестей с ${at}, ${ago}`,
    ask: n => `Нужно ваше решение (№${n})`,
    fallback: 'Пока иду с вариантом:',
    asked: 'Спросил в',
    answerHint: 'Нажмите, чтобы написать ответ',
    answerLabel: n => `Ответ на вопрос №${n}`,
    draft: 'черновик ответа',
    copy: 'Скопировать ответы',
    copied: n => `скопировано (${n})`,
    copyFailed: 'не удалось скопировать',
    answersFor: title => `Ответы по прогону «${title}»:`,
    answerItem: (n, question) => `№${n} ${question}`,
    decisions: 'Решения',
    why: 'почему',
    evidence: 'доказательство',
    reverted: 'отброшено',
    stuck: 'Стоят',
    results: 'Результаты',
    answered: 'Отвечено',
    justNow: 'только что',
    minAgo: m => `${m} мин назад`,
    hoursAgo: (h, m) => `${h} ч ${m} мин назад`,
    daysAgo: d => `${d} дн назад`,
  },
};
const CYRILLIC = /[Ѐ-ӿ]/;
const lang = [R.title, ...R.steps.map(s => s.title)].some(t => CYRILLIC.test(t || '')) ? 'ru' : 'en';
const L = LABELS[lang];
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const hm = t => {
  const d = new Date(t);
  return Number.isNaN(d.getTime()) ? '' : d.toLocaleString(L.locale, {hour: '2-digit', minute: '2-digit'});
};
const ago = t => {
  const m = Math.round((Date.now() - new Date(t)) / 60e3);
  return m < 1 ? L.justNow : m < 60 ? L.minAgo(m) : m < 1440 ? L.hoursAgo(Math.floor(m / 60), m % 60) : L.daysAgo(Math.floor(m / 1440));
};
const steps = R.steps.map(s => ({...s, stale: s.status === 'active' && Date.now() - new Date(R.updatedAt) > STALE_MS}));
const stuck = steps.filter(s => s.status === 'blocked' || s.stale);
const done = steps.filter(s => s.status === 'done').length;
const current = steps.find(s => s.status === 'active');
const openAsks = R.asks.filter(a => a.answer === undefined);
const answered = R.asks.filter(a => a.answer !== undefined);
const link = d => d.href ? `<a href="${esc(d.href)}">${esc(d.title)}</a>` : esc(d.title);
const why = s => s.stale ? L.stale(hm(R.updatedAt), ago(R.updatedAt)) : `${L.waitsFor} ${esc(s.waitsFor)}`;
const newest = (items, key) => [...items].sort((a, b) => (b[key] || '').localeCompare(a[key] || '') || (b.n || 0) - (a.n || 0));
const details = d => [[L.why, d.why], [L.evidence, d.evidence]].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('');
const card = d => {
  const isReverted = d.result === 'reverted';
  const extra = details(d);
  return `<li class="card${isReverted ? ' reverted' : ''}"><div class="top"><time>${hm(d.at)}</time>${isReverted ? `<span class="tag">${L.reverted}</span>` : ''}</div>
    <p class="txt">${esc(d.text)}</p>${extra ? `<dl>${extra}</dl>` : ''}</li>`;
};
const sign = q => `<section class="sign" data-n="${q.n}" tabindex="0"><h2>${L.ask(q.n)}</h2><p>${esc(q.question)}</p>
  <p class="def">${L.fallback} <b>${esc(q.default)}</b></p><p class="when">${L.asked} ${hm(q.askedAt)}, ${ago(q.askedAt)}</p>
  <p class="draft" hidden><span class="tag">${L.draft}</span><span class="first"></span></p>
  <p class="hint">${L.answerHint}</p>
  <textarea class="reply" hidden aria-label="${L.answerLabel(q.n)}"></textarea></section>`;

function draftKey(q) {
  return `jig-dash-answer:${location.pathname}:${q.n}:${q.askedAt}`;
}

function answersText(drafts) {
  const items = openAsks
    .map(q => ({q, answer: String(drafts[q.n] ?? '').trim()}))
    .filter(item => item.answer !== '')
    .sort((a, b) => a.q.n - b.q.n)
    .map(({q, answer}) => `${L.answerItem(q.n, q.question)}\n→ ${answer}`);
  return {count: items.length, text: items.length ? `${L.answersFor(R.title)}\n${items.join('\n\n')}` : ''};
}

const readDraft = q => {
  try {
    return localStorage.getItem(draftKey(q)) ?? '';
  } catch {
    return '';
  }
};

const drafts = Object.fromEntries(openAsks.map(q => [q.n, readDraft(q)]));
let hasUnsaved = false;

document.documentElement.lang = lang;
document.body.classList.toggle('light', localStorage.getItem('jig-dash-theme') === 'light');
document.title = R.title || L.run;
document.getElementById('app').innerHTML = `<div class="wrap">
  <header class="head"><div><h1>${esc(R.title)}</h1><p class="sub">${L.branch} ${esc(R.branch)}, ${L.updated} ${hm(R.updatedAt)}, ${ago(R.updatedAt)}</p></div>
    <div class="pos"><span>${current ? L.step(current.n, steps.length) : L.done(done, steps.length)}</span>
    ${openAsks.length ? `<button class="copy" type="button">${L.copy}</button>` : ''}
    <button class="theme" type="button" aria-label="${L.theme}">&#9680;</button></div></header>
  ${openAsks.length ? `<div class="signs">${openAsks.map(sign).join('')}</div>` : ''}
  ${R.decisions.length ? `<section class="decided"><h2>${L.decisions}</h2><ol class="cards">${newest(R.decisions, 'at').map(card).join('')}</ol></section>` : ''}
  <div class="body"><div>
    <ol class="line" aria-label="${L.steps}">${steps.map(s => `<li class="s-${s.status}${s.stale ? ' stale' : ''}">
      <time>${s.status === 'todo' ? '' : hm(s.at)}</time><span class="st"><i></i></span>
      <div class="nm"><b>${s.n}. ${esc(s.title)}</b>${s === current ? `<span class="here">${L.here}</span>` : ''}
        ${s.status === 'blocked' || s.stale ? `<small>${why(s)}</small>` : s === current ? `<small>${L.since} ${hm(s.at)}</small>` : ''}</div></li>`).join('')}</ol></div>
    <aside>
      ${stuck.length ? `<section><h2>${L.stuck}</h2><ul class="closed">${stuck.map(s => `<li><div>${s.n}. ${esc(s.title)}<small>${why(s)}</small></div></li>`).join('')}</ul></section>` : ''}
      ${R.results.length ? `<section><h2>${L.results}</h2><ul class="list">${newest(R.results, 'at').map(d => `<li><time>${hm(d.at)}</time><span>${link(d)}</span></li>`).join('')}</ul></section>` : ''}
      ${answered.length ? `<section><h2>${L.answered}</h2><ul class="list">${newest(answered, 'answeredAt').map(a => `<li><time>${hm(a.answeredAt)}</time><span>${esc(a.question)}<small>${esc(a.answer)}</small></span></li>`).join('')}</ul></section>` : ''}
    </aside>
  </div>
</div>`;

const copyButton = document.querySelector('.copy');
const refreshCopy = () => {
  if (copyButton) copyButton.disabled = answersText(drafts).count === 0;
};

const writeClipboard = async text => {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch {
    const area = document.createElement('textarea');
    area.value = text;
    area.setAttribute('readonly', '');
    area.style.position = 'fixed';
    area.style.opacity = '0';
    document.body.append(area);
    area.select();
    const isCopied = document.execCommand('copy');
    area.remove();
    return isCopied;
  }
};

for (const box of document.querySelectorAll('.sign')) {
  const q = openAsks.find(a => String(a.n) === box.dataset.n);
  const reply = box.querySelector('.reply');
  const draft = box.querySelector('.draft');
  const hint = box.querySelector('.hint');
  const showDraft = () => {
    const first = drafts[q.n].trim().split('\n')[0];
    const isEditing = !reply.hidden;
    draft.hidden = isEditing || first === '';
    hint.hidden = isEditing;
    draft.querySelector('.first').textContent = first;
  };
  const open = () => {
    if (!reply.hidden) return;
    reply.hidden = false;
    reply.value = drafts[q.n];
    showDraft();
    reply.focus();
  };
  box.addEventListener('click', open);
  box.addEventListener('keydown', event => {
    if (event.target === box && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      open();
    }
  });
  reply.addEventListener('input', () => {
    drafts[q.n] = reply.value;
    try {
      if (reply.value.trim() === '') localStorage.removeItem(draftKey(q));
      else localStorage.setItem(draftKey(q), reply.value);
      hasUnsaved = false;
    } catch {
      hasUnsaved = true;
    }
    refreshCopy();
  });
  reply.addEventListener('blur', () => {
    if (hasUnsaved) return;
    reply.hidden = true;
    showDraft();
  });
  showDraft();
}

refreshCopy();
copyButton?.addEventListener('click', async () => {
  const {text, count} = answersText(drafts);
  if (count === 0) return;
  const isCopied = await writeClipboard(text);
  copyButton.textContent = isCopied ? L.copied(count) : L.copyFailed;
  setTimeout(() => { copyButton.textContent = L.copy; }, COPIED_MS);
});

document.querySelector('.theme').addEventListener('click', () => {
  const isLight = document.body.classList.toggle('light');
  localStorage.setItem('jig-dash-theme', isLight ? 'light' : 'dark');
});

setInterval(() => {
  const isTyping = document.activeElement?.classList?.contains('reply');
  if (!isTyping && !hasUnsaved) location.reload();
}, REFRESH_MS);
</script>
</body>
</html>
